<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: Manrope, sans-serif;
      color: #f4f7fb;
      background:
        radial-gradient(circle at 78% 18%, rgba(47, 111, 237, 0.38), transparent 28%),
        radial-gradient(circle at 12% 82%, rgba(34, 211, 238, 0.16), transparent 26%),
        #07111f;
    }
    .grade {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 78%, transparent 100%);
    }
    .quadro {
      position: relative;
      height: 1920px;
      padding: 180px 96px 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .marca { width: 168px; height: auto; }
    .selo {
      margin-top: 88px;
      color: #8eb6ff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 28px;
      max-width: 860px;
      font-size: 92px;
      line-height: 0.98;
      letter-spacing: -0.045em;
      font-weight: 800;
    }
    h1 span { color: #3b82f6; }
    .resumo {
      margin-top: 36px;
      max-width: 720px;
      color: #c5d4e8;
      font-size: 36px;
      line-height: 1.35;
      font-weight: 500;
    }
    .lista {
      margin-top: 64px;
      display: grid;
      gap: 18px;
    }
    .lista div {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #e8eef7;
      font-size: 32px;
      font-weight: 600;
    }
    .lista i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 0 8px rgba(34, 211, 238, 0.12);
    }
    .rodape { margin-top: 120px; }
    .cidade {
      color: #9fb0c6;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .link {
      display: inline-flex;
      margin-top: 22px;
      padding: 22px 36px;
      border-radius: 999px;
      background: #2f6fed;
      color: white;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="grade"></div>
  <main class="quadro">
    <img class="marca" src="logo.png" alt="">
    <p class="selo">Vyntra Solutions</p>
    <h1>Tecnologia que <span>resolve.</span></h1>
    <p class="resumo">Suporte de TI, redes, servidores, sistemas e segurança da informação.</p>
    <div class="lista">
      <div><i></i>Atendimento em Belo Horizonte</div>
      <div><i></i>Remoto ou presencial</div>
    </div>
    <div class="rodape">
      <p class="cidade">Acesse o site</p>
      <p class="link">vyntrasolutions.com.br</p>
    </div>
  </main>
</body>
</html>
